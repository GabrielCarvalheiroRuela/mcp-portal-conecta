services:
  mcp-funcionalidades:
    build: .
    pull_policy: build
    container_name: mcp-funcionalidades
    restart: unless-stopped
    environment:
      # Token que o Claude manda no cabeçalho Authorization. Gere com: openssl rand -hex 32
      - MCP_TOKEN=${MCP_TOKEN:?defina MCP_TOKEN}
      # Banco do Monint (mesmo host e base do DATABASE_URL da API), mas com o usuário mcp_func, que só lê as views.
      - DB_HOST=${DB_HOST:?defina DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:?defina DB_NAME}
      - DB_USER=${DB_USER:?defina DB_USER}
      - DB_PASSWORD=${DB_PASSWORD:?defina DB_PASSWORD}
      # Botão "Conectar MCP" do portal: o MCP não tem endereço público (só a rede Docker), então fica vazio e o botão
      # responde que não há como conectar de fora. Se um dia ganhar DNS, preencha com https://<host>/mcp e devolva os
      # labels do Traefik.
      - MCP_URL_PUBLICA=${MCP_URL_PUBLICA:-}
      - MONITORAMENTO_API_URL=${MONITORAMENTO_API_URL:-}
    # Sem labels do Traefik de propósito: o MCP lê o banco e não deve ser roteado para a internet. Quem fala com ele são
    # o n8n (http://mcp-funcionalidades:3002/mcp, com o Bearer) e o nginx do portal (/mcp-status e /mcp-conexao), todos
    # na network_traefik.
    expose:
      - "3002"
    networks:
      - network_traefik

networks:
  network_traefik:
    external: true
